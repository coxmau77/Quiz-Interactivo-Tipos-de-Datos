<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Tipos de Datos en Pseudocódigo</title>
    <script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
        darkMode: 'class'
    }
</script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="dark bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 h-screen flex items-center justify-center p-2 sm:p-4 selection:bg-indigo-500 selection:text-white overflow-hidden transition-colors">

    <div class="w-full max-w-4xl h-full sm:h-auto sm:min-h-[600px] bg-white/80 dark:bg-slate-800/50 backdrop-blur-md border border-slate-200 dark:border-slate-700/50 rounded-2xl sm:rounded-3xl shadow-2xl overflow-hidden flex flex-col transition-colors">
        
        <div class="px-5 sm:px-6 py-4 sm:py-5 border-b border-slate-200 dark:border-slate-700/50 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 sm:gap-4">
            <div class="flex items-center gap-3">
                <div class="p-2 sm:p-2.5 bg-indigo-500/10 rounded-xl text-indigo-500 dark:text-indigo-400">
                    <svg class="w-5 sm:w-6 h-5 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold text-slate-800 dark:text-slate-100 tracking-tight">Tipos de Datos</h1>
                    <p class="text-xs sm:text-xs text-slate-500 dark:text-slate-400">Pseudocódigo y Programación</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-2 bg-slate-200 dark:bg-slate-800 p-2 rounded-xl border border-slate-300 dark:border-slate-700/40 text-sm self-start sm:self-auto">
                    <div class="flex items-center gap-1.5 px-2 py-0.5 text-emerald-500 dark:text-emerald-400 font-semibold">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 dark:bg-emerald-400 animate-pulse"></span>
                        <span id="score-counter">0</span> <span class="text-slate-500 dark:text-slate-500 font-normal">Aciertos</span>
                    </div>
                </div>
                <button id="theme-toggle" class="p-2 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700/50 transition-colors" title="Cambiar tema">
                    <svg id="moon-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                    </svg>
                    <svg id="sun-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <div class="w-full bg-slate-200 dark:bg-slate-700/30 h-2">
            <div id="progress-bar" class="bg-indigo-500 h-2 w-0 transition-all duration-300 ease-out"></div>
        </div>

        <div id="welcome-screen" class="p-6 sm:p-8 lg:p-10 flex-1 flex flex-col items-center justify-center text-center">
            <div class="w-24 sm:w-28 h-24 sm:h-28 bg-indigo-500/10 text-indigo-400 rounded-3xl flex items-center justify-center mx-auto mb-6 sm:mb-8">
                <svg class="w-12 sm:w-14 h-12 sm:h-14" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                </svg>
            </div>
            <h2 class="text-2xl sm:text-3xl lg:text-4xl font-extrabold text-slate-800 dark:text-white mb-3 sm:mb-4">Quiz: Conceptos Clave</h2>
            <p class="text-slate-500 dark:text-slate-400 max-w-lg mx-auto mb-8 text-sm sm:text-base lg:text-lg leading-relaxed">
                Ponte a prueba con este cuestionario interactivo de 10 preguntas diseñado para dominar los tipos de datos en algoritmos y bases de datos.
            </p>
            <button id="start-btn" class="w-full sm:w-auto px-8 py-4 sm:py-5 bg-indigo-500 hover:bg-indigo-600 text-white font-semibold rounded-2xl shadow-lg shadow-indigo-500/20 active:scale-95 transition-all text-base tracking-wide">
                Comenzar Quiz
            </button>
        </div>

        <div id="quiz-screen" class="p-5 sm:p-6 lg:p-8 flex-1 flex flex-col hidden">
            <div class="flex items-center justify-between mb-4 sm:mb-5">
                <span class="text-sm font-semibold uppercase tracking-wider text-indigo-500 dark:text-indigo-400 bg-indigo-500/10 px-3 py-1.5 rounded-full" id="question-indicator">
                    Pregunta 1 de 10
                </span>
                <button id="hint-btn" class="text-sm flex items-center gap-1.5 text-amber-500 dark:text-amber-400/90 hover:text-amber-600 dark:hover:text-amber-400 transition-colors font-medium">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    Ver Pista
                </button>
            </div>

            <div id="hint-box" class="mb-5 p-4 sm:p-5 bg-amber-500/10 border border-amber-500/20 rounded-2xl hidden transition-all">
                <div class="flex gap-2.5">
                    <div class="text-amber-500 dark:text-amber-400 mt-0.5">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path>
                        </svg>
                    </div>
                    <div>
                        <span class="text-xs sm:text-sm font-semibold text-amber-500 dark:text-amber-400 uppercase tracking-wide">Pista útil</span>
                        <p id="hint-text" class="text-sm text-slate-600 dark:text-slate-300 mt-1 leading-relaxed"></p>
                    </div>
                </div>
            </div>

            <h3 id="question-text" class="text-lg sm:text-xl lg:text-2xl font-bold text-slate-800 dark:text-white mb-5 sm:mb-6 leading-snug">
            </h3>

            <div id="options-container" class="space-y-3 sm:space-y-4 flex-1 mb-5 sm:mb-6">
            </div>

            <div id="feedback-card" class="mb-5 p-4 sm:p-5 rounded-2xl border border-slate-200 dark:border-slate-700/50 bg-slate-50 dark:bg-slate-800/30 hidden transition-all">
                <div class="flex gap-3">
                    <div id="feedback-icon" class="mt-0.5 flex-shrink-0">
                    </div>
                    <div>
                        <h4 id="feedback-title" class="text-sm sm:text-base font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300"></h4>
                        <p id="feedback-text" class="text-sm text-slate-600 dark:text-slate-300 mt-1 leading-relaxed"></p>
                    </div>
                </div>
            </div>

            <div class="flex justify-end border-t border-slate-200 dark:border-slate-700/50 pt-4 sm:pt-5">
                <button id="next-btn" class="w-full sm:w-auto px-6 py-3.5 sm:py-4 bg-indigo-500 hover:bg-indigo-600 disabled:bg-slate-300 dark:bg-slate-700 disabled:text-slate-400 dark:disabled:text-slate-500 disabled:cursor-not-allowed text-white font-semibold rounded-2xl flex items-center justify-center gap-2 active:scale-95 transition-all text-base" disabled>
                    <span>Comprobar respuesta</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </button>
            </div>
        </div>

        <div id="result-screen" class="p-6 sm:p-8 lg:p-10 flex-1 flex flex-col items-center justify-center text-center hidden">
            <div id="badge-container" class="w-28 sm:w-32 h-28 sm:h-32 rounded-full flex items-center justify-center mx-auto mb-6 sm:mb-8">
            </div>
            
            <h2 id="result-title" class="text-2xl sm:text-3xl lg:text-4xl font-extrabold text-slate-800 dark:text-white mb-3 sm:mb-4"></h2>
            <p id="result-subtitle" class="text-slate-500 dark:text-slate-400 max-w-lg mx-auto text-base sm:text-lg mb-8 sm:mb-10"></p>

            <div class="grid grid-cols-2 gap-4 sm:gap-6 max-w-md mx-auto mb-8 sm:mb-10 w-full">
                <div class="bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/50 p-5 sm:p-6 rounded-2xl">
                    <span class="text-xs sm:text-sm font-semibold text-slate-500 dark:text-slate-400 uppercase block tracking-wider mb-2">Puntuación</span>
                    <span id="final-score" class="text-3xl sm:text-4xl font-extrabold text-indigo-500 dark:text-indigo-400">0/10</span>
                </div>
                <div class="bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/50 p-5 sm:p-6 rounded-2xl">
                    <span class="text-xs sm:text-sm font-semibold text-slate-500 dark:text-slate-400 uppercase block tracking-wider mb-2">Efectividad</span>
                    <span id="final-percent" class="text-3xl sm:text-4xl font-extrabold text-emerald-500 dark:text-emerald-400">0%</span>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-3 sm:gap-4 justify-center max-w-md mx-auto w-full">
                <button id="restart-btn" class="flex-1 px-6 py-4 sm:py-5 bg-indigo-500 hover:bg-indigo-600 text-white font-semibold rounded-2xl active:scale-95 transition-all text-base flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 15H18"></path>
                    </svg>
                    Reintentar Quiz
                </button>
            </div>
        </div>

    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
